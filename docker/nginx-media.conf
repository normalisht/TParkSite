server {
    listen 80;
    server_tokens off;

    location /media/ {
        alias /data/media/;
        autoindex off;
        # Имена файлов уникальны (UploadTo — случайные, CACHE/ imagekit — хеши), поэтому кешируем навсегда.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        return 404;
    }
}
