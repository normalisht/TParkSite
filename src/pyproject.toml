[project]
name = "tpark"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2,<6.2",
    "django-axes[ipware]>=8.3.1",
    "django-imagekit>=6.1.1",
    "django-prose-editor>=0.27.3",
    "django-simple-history>=3.13",
    "django-tailwind-cli>=4.8.1",
    "django-unfold>=0.108.0",
    "gunicorn>=26.2.0",
    "nh3>=0.3.7",
    "pillow>=12.3.0",
    "unidecode>=1.4.0",
    "whitenoise[brotli]>=6.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
]
e2e = [
    "pytest-playwright>=0.10.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = ["e2e: браузерные тесты вёрстки (make e2e)"]
filterwarnings = [
    "ignore:No directory at:UserWarning",
    "ignore:Overriding get_action_choices",
    # django-simple-history 3.13 вызывает select_related() без аргументов (устареет в Django 2028)
    "ignore:Calling select_related\\(\\) with no arguments:PendingDeprecationWarning:simple_history",
]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Списки в Meta и в миграциях — стандартная идиома Django.
ignore = ["RUF012"]
