{% if phones %}
{# items-end: кнопка прижата к правому краю и не сдвигается, когда раскрывается более широкий список ссылок. #}
<div x-data="{ open: false }" @click.outside="open = false" @keydown.escape.window="open = false" class="contact-fab fixed bottom-4 right-4 z-50 flex flex-col items-end lg:hidden">
  <div id="contact-menu" x-show="open" x-cloak
       x-transition:enter="transition duration-150 ease-out" x-transition:enter-start="translate-y-2 opacity-0" x-transition:enter-end="translate-y-0 opacity-100"
       x-transition:leave="transition duration-100 ease-in" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
       class="mb-3 flex flex-col items-end gap-2">
    {% include "partials/contact_links.html" %}
  </div>
  <button type="button" @click="open = !open" :aria-expanded="open" aria-controls="contact-menu" class="group btn btn-primary shadow-lg">
    {# Трубка и крестик лежат друг на друге и плавно сменяют друг друга по aria-expanded кнопки; ширина кнопки не меняется. #}
    <span class="grid h-5 w-5">
      <span class="icon col-start-1 row-start-1 h-5 w-5 transition duration-200 motion-reduce:transition-none group-aria-expanded:rotate-90 group-aria-expanded:scale-50 group-aria-expanded:opacity-0" aria-hidden="true">{% include "icons/phone.svg" %}</span>
      <span class="icon col-start-1 row-start-1 h-5 w-5 -rotate-90 scale-50 opacity-0 transition duration-200 motion-reduce:transition-none group-aria-expanded:rotate-0 group-aria-expanded:scale-100 group-aria-expanded:opacity-100" aria-hidden="true">{% include "icons/x.svg" %}</span>
    </span>
    <span>Связаться</span><span x-show="open" x-cloak class="sr-only">— закрыть</span>
  </button>
</div>
{% endif %}
