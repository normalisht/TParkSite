{% if service.has_page %}
<a href="{{ service.get_absolute_url }}" class="flex items-center justify-between gap-3 px-4 py-3 sm:gap-4 sm:px-5 sm:py-4 hover:bg-brand-50">
  <span class="min-w-0 break-words font-medium">{{ service.name }}</span>
  <span class="flex max-w-[50%] items-center gap-1.5 text-right text-ink/70 sm:gap-2"><span class="min-w-0">{% include "catalog/partials/price.html" %}</span><span class="icon h-4 w-4 shrink-0">{% include "icons/chevron-right.svg" %}</span></span>
</a>
{% elif service.short_description %}
<div x-data="{ open: false }">
  <button type="button" @click="open = !open" :aria-expanded="open" class="flex w-full items-center justify-between gap-3 px-4 py-3 sm:gap-4 sm:px-5 sm:py-4 text-left hover:bg-brand-50">
    <span class="min-w-0 break-words font-medium">{{ service.name }}</span>
    <span class="flex max-w-[50%] items-center gap-1.5 text-right text-ink/70 sm:gap-2"><span class="min-w-0">{% include "catalog/partials/price.html" %}</span><span class="icon h-4 w-4 shrink-0 transition" :class="open && 'rotate-180'">{% include "icons/chevron-down.svg" %}</span></span>
  </button>
  <div x-show="open" x-transition x-cloak class="rich-text px-4 pb-4 sm:px-5 sm:pb-5">{{ service.short_description|safe }}</div>
</div>
{% else %}
<div class="flex items-center justify-between gap-3 px-4 py-3 sm:gap-4 sm:px-5 sm:py-4">
  <span class="min-w-0 break-words font-medium">{{ service.name }}</span>
  <span class="max-w-[50%] text-right text-ink/70">{% include "catalog/partials/price.html" %}</span>
</div>
{% endif %}
