{# Цена и единица — неразрывные куски: перенос только по слешу; перенеслась единица — site.js (fitPrices) ставит data-wrapped: слеш убирается, единица с новой строки. #}
{% if service.price %}<span class="inline-block whitespace-nowrap">{{ service.price_amount }}</span>{% if service.price_unit %} <span class="js-price-unit group/price inline-block data-wrapped:block"><span class="group-data-wrapped/price:hidden">/ </span>{{ service.price_unit }}</span>{% endif %}{% endif %}
