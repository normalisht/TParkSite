# Пример сайта для nginx на хосте при запуске без Docker (systemd + gunicorn на unix-сокете).
# Вместо uwsgi_pass старого сайта — proxy_pass в сокет gunicorn. Подставить:
#   /run/tpark/      — /run/<SERVICE>/ (SERVICE из make service-install, по умолчанию tpark);
#   /path/to/media/  — MEDIA_ROOT из src/.env (по умолчанию <репозиторий>/src/media/), со слешем на конце;
#   ssl_certificate* — пути к уже выпущенному сертификату (certbot).
# Положить в /etc/nginx/sites-available/, включить, проверить `sudo nginx -t` и `sudo systemctl reload nginx`.

upstream tpark_web {
    server unix:/run/tpark/gunicorn.sock fail_timeout=0;
}

# Подбор пароля к админке: не больше 10 попыток входа в минуту с адреса (+5 сразу), дальше — 429.
limit_req_zone $binary_remote_addr zone=tpark_admin_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name t-camp.ru www.t-camp.ru;

    # Сразу на главный домен по https: http://www… — одним редиректом, без промежуточного www.
    location / {
        return 301 https://t-camp.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name t-camp.ru www.t-camp.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/t-camp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/t-camp.ru/privkey.pem;

    # Загрузка фото пачкой в админке.
    client_max_body_size 200m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # X-Real-IP перезаписывается адресом клиента: по нему django-axes блокирует подбор пароля.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_redirect off;

    location /media/ {
        alias /path/to/media/;
        autoindex off;
        # Имена файлов уникальны (UploadTo — случайные, CACHE/ imagekit — хеши), поэтому кешируем навсегда.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /admin/login/ {
        limit_req zone=tpark_admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://tpark_web;
    }

    # Статику (/static/) отдаёт WhiteNoise внутри gunicorn — со сжатием и вечным кешем.
    location / {
        proxy_pass http://tpark_web;
    }
}
