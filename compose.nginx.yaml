# Продакшен без общего reverse-proxy: свой nginx публикует 80/443, сам терминирует HTTPS,
# отдаёт /media/ из тома и проксирует остальное в gunicorn.
#   docker compose -f compose.nginx.yaml up -d --build
# Сертификаты Let's Encrypt выпускает certbot на хосте (см. README); nginx читает их из LETSENCRYPT_DIR.
# Тома те же, что у compose.yaml (db, media) — при переходе между вариантами данные сохраняются.
services:
  tpark-web:
    build: .
    image: tpark-web
    env_file: .env
    restart: unless-stopped
    volumes:
      - db:/data/db
      - media:/data/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  tpark-nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      tpark-web:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME:-t-camp.ru www.t-camp.ru}
      CERT_NAME: ${CERT_NAME:-t-camp.ru}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - media:/data/media:ro
      - ./docker/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro

volumes:
  db:
  media:
