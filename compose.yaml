# Логи контейнеров: не больше 5 файлов по 10 МБ, иначе access-логи забьют диск, и SQLite перестанет писать.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  tpark-web:
    build: .
    image: tpark-web
    env_file: .env
    restart: unless-stopped
    volumes:
      - db:/data/db
      - media:/data/media
    networks: [proxy]
    # Пережатие фото держит их в памяти; без лимита OOM-killer может положить весь сервер.
    mem_limit: ${WEB_MEM_LIMIT:-1g}
    logging: *logging
    # Код в образе только для чтения; пишет сайт лишь в тома /data и во временную /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  tpark-media:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    volumes:
      - media:/data/media:ro
      - ./docker/nginx-media.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [proxy]
    logging: *logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db:
  media:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Укажите PROXY_NETWORK в .env}
