services:
  tpark-web:
    build: .
    image: tpark-web
    env_file: .env
    restart: unless-stopped
    volumes:
      - db:/data/db
      - media:/data/media
    networks: [proxy]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  tpark-media:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - media:/data/media:ro
      - ./docker/nginx-media.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [proxy]

volumes:
  db:
  media:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Укажите PROXY_NETWORK в .env}
