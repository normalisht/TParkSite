# Локальный запуск: docker compose -f compose.dev.yaml up --build --renew-anon-volumes → http://localhost:8000
# (или make dev). --renew-anon-volumes обязателен: .venv образа лежит в анонимном томе (ниже), а compose
# при пересоздании контейнера оставляет старый том — без флага новые зависимости не появятся.
# Код из src/ примонтирован в контейнер: runserver перезапускается при правках, Tailwind пересобирается.
# Продакшен — compose.yaml.
services:
  tpark-dev:
    build: .
    image: tpark-web
    command: ["python", "manage.py", "tailwind", "runserver", "0.0.0.0:8000"]
    env_file:
      - src/.env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app
      # Не даём локальным .venv и бинарнику Tailwind (собраны под macOS) перекрыть линуксовые из образа.
      - /app/.venv
      - /app/.django_tailwind_cli
      - dev-db:/data/db
      - dev-media:/data/media

volumes:
  dev-db:
  dev-media:
