[project]
name = "tpark"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2,<6.2",
    "django-imagekit>=6.1.1",
    "django-prose-editor>=0.27.3",
    "django-tailwind-cli>=4.8.1",
    "django-unfold>=0.108.0",
    "gunicorn>=26.2.0",
    "nh3>=0.3.7",
    "pillow>=12.3.0",
    "unidecode>=1.4.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["old_version", "docs", "*/migrations/*"]

[tool.ruff.lint]
# Списки в Meta и в миграциях — стандартная идиома Django.
ignore = ["RUF012"]
